<div class="header-big  post-top css-color mb-4" id="search-bg">
    <h1 class="big-title text-center mb-4">AI 一人公司导航</h1>
    <div class="s-search">
        <div id="search" class="s-search mx-auto">
            <div id="search-list-menu" class="hide-type-list">
                <div class="s-type text-center">
                    <div class="s-type-list big">
                        <div class="anchor" style="position: absolute; left: 50%; opacity: 0;"></div>
                        <label for="type-baidu1"  data-id="group-b"><span>搜索</span></label>
                        <label for="type-metaso" data-id="group-g"><span>AI搜索</span></label>
                        <label for="type-doubao"   data-id="group-h"><span>AI对话</span></label>
                        <label for="type-zhannei"  data-id="group-i"><span>站内搜索</span></label>
                    </div>
                </div>
            </div>

            <form action="https://www.baidu.com/s?wd=" method="get" target="_blank" class="super-search-fm">
                <input type="text" id="search-text" class="form-control smart-tips search-key" 
                    zhannei="" placeholder="输入关键字搜索" style="outline:0" autocomplete="off">
                <button class="submit" type="submit"><i class="iconfont icon-search"></i></button>
            </form>

            <div id="search-list" class="hide-type-list">
                <div class="search-group group-b">
                    <ul class="search-type">
                        <li><input hidden="" type="radio" name="type" checked="checked"
                                id="type-baidu1"
                                value="https://www.baidu.com/s?wd=" 
                                data-placeholder="百度一下，你就知道">
                            <label for="type-baidu1"><span class="text-muted">百度</span></label>
                        </li>
                        <li><input hidden="" type="radio" name="type" 
                                id="type-google1"
                                value="https://www.google.com/search?q=" 
                                data-placeholder="谷歌搜索">
                            <label for="type-google1"><span class="text-muted">谷歌</span></label>
                        </li>
                        <li><input hidden="" type="radio" name="type" 
                                id="type-bing1"
                                value="https://cn.bing.com/search?q=" 
                                data-placeholder="微软必应搜索">
                            <label for="type-bing1"><span class="text-muted">必应</span></label>
                        </li>
                        <li><input hidden="" type="radio" name="type" 
                                id="type-sogo"
                                value="https://www.sogou.com/web?query=" 
                                data-placeholder="搜狗搜索"> 
                            <label for="type-sogo"><span class="text-muted">搜狗</span></label>
                        </li>
                        <li><input hidden="" type="radio" name="type" 
                                id="type-360"
                                value="https://www.so.com/s?q=" 
                                data-placeholder="360 好搜">
                            <label for="type-360"><span class="text-muted">360</span></label>
                        </li>
                        <li><input hidden="" type="radio" name="type" 
                                id="type-sm"
                                value="https://yz.m.sm.cn/s?q=" 
                                data-placeholder="UC 移动端搜索">
                            <label for="type-sm"><span class="text-muted">神马</span></label>
                        </li>
                    </ul>
                </div>
                <div class="search-group group-g">
                    <ul class="search-type">
                        <li><input hidden="" type="radio" name="type" checked="checked"
                                id="type-metaso"
                                value="https://metaso.cn/?q=" 
                                data-placeholder="秘塔AI 搜索">
                            <label for="type-metaso"><span class="text-muted">秘塔AI</span></label>
                        </li>
                        <li><input hidden="" type="radio" name="type" 
                                id="type-perplexity"
                                value="https://www.perplexity.ai/search?q=" 
                                data-placeholder="Perplexity AI 搜索">
                            <label for="type-perplexity"><span class="text-muted">Perplexity</span></label>
                        </li>
                    </ul>
                </div>
                <div class="search-group group-h">
                    <ul class="search-type">
                        <li><input hidden="" type="radio" name="type" 
                                id="type-doubao"
                                value="https://www.doubao.com/" 
                                data-placeholder="豆包（不支持直接传参，需粘贴）">
                            <label for="type-doubao"><span class="text-muted">豆包</span></label>
                        </li>
                        <li><input hidden="" type="radio" name="type" 
                                id="type-deepseek"
                                value="https://chat.deepseek.com/a/chat?q=" 
                                data-placeholder="DeepSeek AI 对话（支持传参）">
                            <label for="type-deepseek"><span class="text-muted">DeepSeek</span></label>
                        </li>
                        <li><input hidden="" type="radio" name="type" 
                                id="type-kimi"
                                value="https://kimi.moonshot.cn/" 
                                data-placeholder="Kimi（不支持直接传参，需粘贴）">
                            <label for="type-kimi"><span class="text-muted">Kimi</span></label>
                        </li>
                        <li><input hidden="" type="radio" name="type" 
                                id="type-tongyi"
                                value="https://tongyi.aliyun.com/" 
                                data-placeholder="通义千问（不支持直接传参，需粘贴）">
                            <label for="type-tongyi"><span class="text-muted">通义千问</span></label>
                        </li>
                    </ul>
                </div>
                <div class="search-group group-i">
                    <ul class="search-type">
                        <li><input hidden="" type="radio" name="type" 
                                id="type-zhannei"
                                value="" 
                                data-placeholder="搜索本站收录的 AI 工具">
                            <label for="type-zhannei"><span class="text-muted">站内搜索</span></label>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="card search-smart-tips search-hot-text">
                <ul id="word" style="display: none"></ul>
            </div>
            <div id="site-search-results" class="card" style="display: none">
                <ul class="site-search-list"></ul>
                <div class="site-search-empty" style="display: none">未找到匹配的工具</div>
            </div>
        </div>
    </div>
</div>
