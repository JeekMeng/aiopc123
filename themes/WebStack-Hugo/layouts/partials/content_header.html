<div class="main-content flex-fill grid-bg">
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {
            "@type": "ListItem",
            "position": 1,
            "name": "首页",
            "item": "{{ .Site.BaseURL }}"
        }{{ if not .IsHome }},
        {
            "@type": "ListItem",
            "position": 2,
            "name": "{{ .Title }}",
            "item": "{{ .Permalink }}"
        }{{ end }}
    ]
}
</script>
