# 广告位配置 —— 按页面分组，可独立设置效果与宽高
# type:  "carousel" 轮播 | "marquee" 跑马灯
# width / height: 横幅宽高(px)。width 缺省则铺满容器全宽。
#   轮播建议行业横幅比例 8:1（width:height = 8:1）
# image: 广告图路径（放 static/assets/images/ads/ 下）
# link:  推广落地链接
# alt:   替代文本

# OPC 专栏（/blog/）
blog:
  type: "carousel"
  width: 1400
  height: 260
  ads:
    - image: "/assets/images/ads/blog_10000.jpg"
      link: "https://loomy.cgref.cn/s/p3kq3rwnol"
      alt: "Loomy"
    - image: "/assets/images/ads/blog_10001.jpg"
      link: "https://volcengine.cgref.cn/s/rpex7p4k90"
      alt: "讯飞绘图"
    - image: "/assets/images/ads/blog_10002.jpg"
      link: "https://turbodesk.cgref.cn/s/1le05ovnoq"
      alt: "蛙蛙写作"

