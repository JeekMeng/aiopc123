<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ .Title }} | AI一人公司导航网</title>
    <link rel="shortcut icon" href="{{ absURL $.Site.Params.images.favicon }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/css/content.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, "SF Pro Text", "Helvetica Neue", "PingFang SC", sans-serif; background: var(--bg-primary, #f5f5f7); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 40px 20px; }
        .query-page { max-width: 640px; width: 100%; }
        .query-hero { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; padding: 3rem 2rem; border-radius: 16px; text-align: center; margin-bottom: 2rem; box-shadow: 0 8px 32px rgba(102,126,234,0.25); }
        .query-hero h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .query-hero p { font-size: 14px; opacity: 0.85; }
        .query-card { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
        .query-form { display: flex; flex-direction: column; gap: 12px; }
        .query-input { width: 100%; padding: 12px 16px; border: 1px solid #e5e5ea; border-radius: 8px; font-size: 15px; outline: none; transition: border-color .2s; }
        .query-input:focus { border-color: #667eea; }
        .query-divider { text-align: center; color: #999; font-size: 13px; position: relative; margin: 4px 0; }
        .query-divider::before, .query-divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: #e5e5ea; }
        .query-divider::before { left: 0; }
        .query-divider::after { right: 0; }
        .query-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity .2s; }
        .query-btn:hover { opacity: 0.9; }
        .query-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-card { background: #fff; border-radius: 12px; padding: 1.25rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 12px; border-left: 4px solid #e5e5ea; }
        .result-card.status-pending { border-left-color: #FF9500; }
        .result-card.status-approved { border-left-color: #34C759; }
        .result-card.status-rejected { border-left-color: #FF3B30; }
        .result-name { font-size: 16px; font-weight: 600; color: #1d1d1f; margin-bottom: 6px; }
        .result-meta { font-size: 13px; color: #86868b; margin-bottom: 4px; }
        .result-status { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .result-status.pending { background: rgba(255,149,0,.12); color: #FF9500; }
        .result-status.approved { background: rgba(52,199,89,.12); color: #34C759; }
        .result-status.rejected { background: rgba(255,59,48,.12); color: #FF3B30; }
        .result-note { margin-top: 8px; padding: 8px 12px; background: #f5f5f7; border-radius: 8px; font-size: 13px; color: #636366; }
        .empty-state { text-align: center; padding: 2rem; color: #86868b; }
        .empty-state i { font-size: 48px; margin-bottom: 12px; color: #d1d1d6; }
        .error-msg { text-align: center; padding: 1rem; color: #FF3B30; font-size: 14px; }
        .back-link { display: inline-block; margin-top: 12px; color: #667eea; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="query-page">
        <div class="query-hero">
            <h1>查询审核结果</h1>
            <p>输入提交时的联系电话、登记网址或电子邮箱，查看入驻申请审核进度</p>
        </div>

        <div class="query-card">
            <div class="query-form">
                <input type="tel" class="query-input" id="queryPhone" placeholder="输入联系电话">
                <div class="query-divider">或</div>
                <input type="url" class="query-input" id="queryWebsite" placeholder="输入网址（如 example.com）">
                <div class="query-divider">或</div>
                <input type="email" class="query-input" id="queryEmail" placeholder="输入电子邮箱">
                <button class="query-btn" id="queryBtn" onclick="doQuery()"><i class="fas fa-search" style="margin-right:8px;"></i>查询</button>
            </div>
        </div>

        <div id="queryResult"></div>

        <div style="text-align:center;margin-top:16px;">
            <a href="/" class="back-link"><i class="fas fa-arrow-left" style="margin-right:4px;"></i>返回首页</a>
            <span style="margin:0 12px;color:#d1d1d6;">|</span>
            <a href="/upload/" class="back-link">重新提交入驻</a>
        </div>
    </div>

    <script>
    var API = (location.port==='1313'||location.port==='1317') ? 'http://localhost:8787/api' : '/api';

    function esc(s) { var d = document.createElement('div'); d.appendChild(document.createTextNode(s || '')); return d.innerHTML; }

    function doQuery() {
        var phone = document.getElementById('queryPhone').value.trim();
        var website = document.getElementById('queryWebsite').value.trim();
        var email = document.getElementById('queryEmail').value.trim();
        if (!phone && !website && !email) { alert('请输入联系电话、登记网址或电子邮箱'); return; }
        var resultEl = document.getElementById('queryResult');
        var btn = document.getElementById('queryBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>查询中...';
        resultEl.innerHTML = '';

        var params = [];
        if (phone) params.push('phone=' + encodeURIComponent(phone));
        if (website) params.push('website=' + encodeURIComponent(website));
        if (email) params.push('email=' + encodeURIComponent(email));

        fetch(API + '/submissions/query?' + params.join('&'))
            .then(function(r) { return r.json(); })
            .then(function(d) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-search" style="margin-right:8px;"></i>查询';
                var items = d.items || [];
                if (!items.length) {
                    resultEl.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><div>未找到相关记录</div><div style="font-size:13px;margin-top:4px;">请确认输入信息是否正确</div></div>';
                    return;
                }
                var statusMap = { pending: '待审核', approved: '已通过', rejected: '已拒绝' };
                var h = items.map(function(s) {
                    var date = s.created_at ? new Date(s.created_at + 'Z').toLocaleDateString('zh-CN') : '-';
                    var noteHtml = s.review_note ? '<div class="result-note"><strong>审核备注：</strong>' + esc(s.review_note) + '</div>' : '';
                    var reviewInfoHtml = s.reviewed_at ? '<div class="result-meta" style="font-size:12px;color:#86868b;">审核时间: ' + new Date(s.reviewed_at).toLocaleString('zh-CN') + (s.reviewed_by ? ' · 审核人员: ' + esc(s.reviewed_by) : '') + '</div>' : '';
                    return '<div class="result-card status-' + s.status + '">' +
                        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                        '<div class="result-name">' + esc(s.name) + '</div>' +
                        '<span class="result-status ' + s.status + '">' + (statusMap[s.status] || s.status) + '</span>' +
                        '</div>' +
                        '<div class="result-meta">' + esc(s.summary) + '</div>' +
                        '<div class="result-meta">城市: ' + esc(s.city) + ' · 提交时间: ' + date + '</div>' +
                        '<div class="result-meta">网址: <a href="' + esc(s.website) + '" target="_blank" style="color:#667eea;text-decoration:none;">' + esc(s.website) + '</a></div>' +
                        noteHtml +
                        reviewInfoHtml +
                        '</div>';
                }).join('');
                resultEl.innerHTML = '<div style="font-size:13px;color:#86868b;margin-bottom:8px;">找到 ' + items.length + ' 条记录</div>' + h;
            })
            .catch(function(e) {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-search" style="margin-right:8px;"></i>查询';
                resultEl.innerHTML = '<div class="error-msg"><i class="fas fa-exclamation-circle"></i> 查询失败，请稍后重试</div>';
            });
    }

    document.getElementById('queryWebsite').addEventListener('keydown', function(e) { if (e.key === 'Enter') doQuery(); });
    document.getElementById('queryPhone').addEventListener('keydown', function(e) { if (e.key === 'Enter') doQuery(); });
    document.getElementById('queryEmail').addEventListener('keydown', function(e) { if (e.key === 'Enter') doQuery(); });
    </script>
</body>
</html>
