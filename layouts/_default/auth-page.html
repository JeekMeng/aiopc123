<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}AI一人公司导航网{{ end }}">
    <title>{{ .Title }} | AI一人公司导航网</title>
    <link rel="canonical" href="{{ .Permalink }}" />
    <link rel="shortcut icon" href="{{ absURL $.Site.Params.images.favicon }}" />

    <meta property="og:title" content="{{ .Title }} | AI一人公司导航网" />
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}AI一人公司导航网{{ end }}" />
    <meta property="og:url" content="{{ .Permalink }}" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="{{ .Site.Title }}" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:image" content="{{ absURL "/assets/images/bi-favicon.png" }}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ .Title }} | AI一人公司导航网" />
    <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}AI一人公司导航网{{ end }}" />
    <meta name="twitter:image" content="{{ absURL "/assets/images/bi-favicon.png" }}" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/assets/css/iconfont-3.03029.1.css">
    <link rel="stylesheet" href="/assets/css/content.css">
    <link rel="stylesheet" href="/assets/css/dynamic.css">
</head>
<body class="app-page">
    <header class="app-topbar">
        <a href="/" class="topbar-logo" style="margin-left:16px;">
            <img src="{{ absURL $.Site.Params.images.logoExpandLight }}" height="28" alt="AI一人公司导航">
            <span>AI一人公司导航</span>
        </a>
        <div class="topbar-right">
            <div class="user-menu-wrap" id="appUserMenu">
                <a href="/user/login/" class="top-btn" style="width:36px;height:36px;border-radius:8px;border:none;background:transparent;color:var(--text-primary);cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;">
                    <i class="fas fa-user"></i>
                </a>
            </div>
        </div>
    </header>

    <main class="app-content">
        {{ .Content }}
    </main>

    {{ partial "footer.html" . }}
</body>
</html>
